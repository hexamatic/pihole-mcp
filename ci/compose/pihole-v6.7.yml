# Pi-hole pair for the CI integration job: FTL v6.7 (pihole/pihole:2026.07.2).
# Deliberately held back. It predates the v6.8 changes to /history and /config, and it is
# the release the existing fixtures were captured from, so it keeps the workarounds for the
# older response shapes honest. Excluded from Dependabot in .github/dependabot.yml.
# No volumes or blocklist download, so both start in seconds.
# Usage: docker compose -f ci/compose/pihole-v6.7.yml up -d --wait
#
# Each file is one leg of the integration matrix in .github/workflows/ci.yml and
# keeps the two-instance pair, so the multi-instance tests run on one version at
# a time rather than across two.

services:
  pihole:
    image: pihole/pihole:2026.07.2
    ports:
      - "8081:80"
    environment:
      TZ: "UTC"
      FTLCONF_webserver_api_password: "test"
      FTLCONF_webserver_api_max_sessions: "256"
      FTLCONF_dns_listeningMode: "single"
      SKIPGRAVITYONBOOT: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL -o /dev/null http://localhost/admin/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Second instance for multi-instance routing, aggregation, and sync tests.
  pihole-secondary:
    image: pihole/pihole:2026.07.2
    ports:
      - "8082:80"
    environment:
      TZ: "UTC"
      FTLCONF_webserver_api_password: "test"
      FTLCONF_webserver_api_max_sessions: "256"
      FTLCONF_dns_listeningMode: "single"
      SKIPGRAVITYONBOOT: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL -o /dev/null http://localhost/admin/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
