# Every entry is a hard pin. `latest` looks like it keeps the toolchain current,
# but mise resolves it once at install time and then never moves, so it is an
# invisible pin that drifts away from CI silently: measured on 31 August 2026,
# a tree resolved from `latest` held golangci-lint 2.11.0 against CI's v2.12 and
# goreleaser 2.15.2 against the 2.18.0 the release action resolves from `~> v2`.
# A visible pin that Dependabot cannot maintain is still better than an
# invisible one nobody can even read.
#
# Keep these in step with the versions CI uses:
#   go                -> go.mod's `toolchain` line, Dockerfile FROM
#   golangci-lint     -> .github/workflows/ci.yml `version:`
#   goreleaser        -> whatever `~> v2` currently resolves to
#   gitleaks          -> .github/workflows/security.yml GITLEAKS_VERSION
[tools]
go = "1.26.7"
"go:golang.org/x/tools/cmd/goimports" = "0.44.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.12.2"
"go:github.com/goreleaser/goreleaser/v2" = "2.18.0"
lefthook = "2.1.12"
gitleaks = "8.30.1"
