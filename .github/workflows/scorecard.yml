name: Scorecard

# OpenSSF Scorecard analyses the repository's supply-chain security posture
# and publishes the score behind the README badge. Results also land in the
# repository's code-scanning tab via SARIF.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Access the GitHub OIDC token to publish verified results to
      # scorecard.dev (feeds the badge and the public viewer).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
